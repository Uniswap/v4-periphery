name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}
jobs:
  run-tests:
    name: Forge Tests
    runs-on: ubuntu-latest

    steps:
      - uses: bullfrogsec/bullfrog@1831f79cce8ad602eef14d2163873f27081ebfb3 # v0.8.4

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: v1.7.1

      - name: Show Forge version
        run: |
          forge --version

      # `forge test` compiles sparsely and does not compile `script/`, so it misses the
      # URCompileAnchor that forces the concrete UniversalRouter into the artifact set. The margin
      # route helpers deploy the router via `vm.getCode("UniversalRouter.sol:UniversalRouter")`, which
      # then fails "no matching artifact found". A full `forge build` first compiles the anchor so the
      # router artifact is present when the tests run.
      - name: Build
        run: forge build
        env:
          FOUNDRY_PROFILE: ci

      - name: Run tests
        run: forge test --isolate -vvv
        env:
          FOUNDRY_PROFILE: ci
          FORGE_SNAPSHOT_CHECK: true
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
