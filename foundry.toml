[profile.default]
out = 'foundry-out'
solc_version = '0.8.26'
optimizer_runs = 44444444
via_ir = true
ffi = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/" }, { access = "read", path = "foundry-out/" }]
evm_version = "cancun"
gas_limit = "3000000000"
fuzz.runs = 10_000
bytecode_hash = "none"

additional_compiler_profiles = [
  { name = "posm", via_ir = true, optimizer_runs = 500 },
  { name = "margin", via_ir = true, optimizer_runs = 2000 },
  { name = "descriptor", via_ir = true, optimizer_runs = 1 },
  { name = "test", via_ir = false }
]

compilation_restrictions = [
  { paths = "src/PositionManager.sol", optimizer_runs = 500 },
  { paths = "src/hooks/permissionedPools/PermissionedPositionManager.sol", optimizer_runs = 500 },
  { paths = "src/MarginRouter.sol", optimizer_runs = 2000 },
  { paths = "src/PositionDescriptor.sol", optimizer_runs = 1 },
  { paths = "test/**", via_ir = false }
]

[profile.debug]
via_ir = false
optimizer_runs = 200
fuzz.runs = 100

[profile.ci]
fuzz.runs = 100_000

# 50M matches geth's default eth_call gas cap (--rpc.gascap); the documented single-shot
# ReservesLens call exceeds a 30M block-style limit by design (~33M for tick spacing 1)
[profile.gas]
gas_limit=50_000_000

# `forge coverage` compiles without the optimizer or via_ir so that hits map back to source. The
# per-file profiles above would still pin MarginRouter and the UR compile anchor to via_ir builds
# that coverage cannot attribute, so this profile drops them. It skips the anchor (UniversalRouter
# cannot compile without via_ir; tests read its default-profile artifact by path, so run
# `forge build` first), raises the code size limit for the unoptimized router, leaves the committed
# gas snapshots alone, and uses its own out/cache directories so a stray build under this profile
# cannot churn the default one.
#   forge build
#   FOUNDRY_PROFILE=coverage forge coverage --no-match-coverage '(test|lib|script)/' --report summary
[profile.coverage]
out = 'foundry-out-coverage'
cache_path = 'cache/coverage'
additional_compiler_profiles = []
compilation_restrictions = []
skip = ['script/**']
code_size_limit = 1_000_000
gas_snapshot_emit = false

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[rpc_endpoints]
sepolia = "https://rpc.sepolia.org"
unichain_sepolia = "https://sepolia.unichain.org"
base_sepolia = "https://sepolia.base.org"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
mainnet = "https://mainnet.infura.io/v3/${INFURA_API_KEY}"
